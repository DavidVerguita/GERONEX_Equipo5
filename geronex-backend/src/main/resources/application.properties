spring.application.name=geronex-backend
server.port=8080

# --- Conexion a MySQL ---
# Usuario y clave NO van aqui: se leen de variables de entorno.
# sslMode=DISABLED y allowPublicKeyRetrieval solo son para desarrollo en localhost.
spring.datasource.url=jdbc:mysql://localhost:3306/geronex?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# validate: solo comprueba que las entidades coincidan con las tablas; nunca modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# JWT_SECRET: variable de entorno con al menos 32 caracteres. NUNCA se escribe aqui.
geronex.jwt.secret=${JWT_SECRET}
geronex.jwt.expiracion-minutos=60

# --- CORS: origenes web autorizados (separados por coma) ---
geronex.cors.origenes=${CORS_ORIGENES:http://localhost:5500,http://127.0.0.1:5500}
