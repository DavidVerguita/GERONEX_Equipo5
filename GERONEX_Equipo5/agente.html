<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERONEX - Solicitudes (agente)</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/geronex.css">
    <link rel="stylesheet" href="css/agente.css">
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">GERONEX</a>
        <ul class="nav-links"><li id="nav-sesion"></li></ul>
    </nav>

    <main class="pagina">
        <div class="encabezado">
            <div>
                <h1>Solicitudes de viaje</h1>
                <p id="subtitulo">Elige una solicitud nueva y arma su cotización con servicios del catálogo.</p>
            </div>
            <span class="actualizado" id="actualizado"></span>
        </div>
        <div id="msg-general" class="msg"></div>
        <div id="resumen"></div>

        <div class="dos-columnas">
            <section>
                <div class="pestanas" id="pestanas"></div>
                <div class="filtros">
                    <input type="search" id="buscar" placeholder="Buscar destino, cliente o #" aria-label="Buscar solicitud">
                    <select id="orden" aria-label="Ordenar">
                        <option value="antiguas">Más antiguas primero</option>
                        <option value="recientes">Más recientes primero</option>
                        <option value="viaje">Fecha de viaje más próxima</option>
                        <option value="presupuesto">Mayor presupuesto</option>
                    </select>
                </div>
                <div id="lista" class="lista-seleccionable"><div class="esqueleto"></div></div>
            </section>

            <section id="cotizador">
                <div class="vacio">Selecciona una solicitud de la lista para ver su detalle.</div>
            </section>
        </div>
    </main>

    <footer><p>&copy; 2026 GERONEX - Todos los derechos reservados.</p></footer>

    <script src="js/geronex.js"></script>
    <script src="js/agente.js"></script>
</body>
</html>
