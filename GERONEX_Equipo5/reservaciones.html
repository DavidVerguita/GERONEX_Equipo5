<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERONEX - Reservaciones</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/geronex.css">
    <link rel="stylesheet" href="css/reservaciones.css">
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">GERONEX</a>
        <ul class="nav-links"><li id="nav-sesion"></li></ul>
    </nav>

    <main class="pagina">
        <div class="encabezado">
            <div>
                <h1>Reservaciones</h1>
                <p id="subtitulo">Valida la disponibilidad con los proveedores y confirma o rechaza cada reservación.</p>
            </div>
            <span class="actualizado" id="actualizado"></span>
        </div>
        <div id="resumen"></div>
        <div class="pestanas" id="pestanas"></div>
        <div class="barra-filtros">
            <input type="search" id="buscar" placeholder="Buscar por folio, cliente, destino o agente" aria-label="Buscar reservación">
            <select id="orden" aria-label="Ordenar">
                <option value="viaje">Fecha de viaje más próxima</option>
                <option value="antiguas">Más antiguas primero</option>
                <option value="recientes">Más recientes primero</option>
                <option value="total">Mayor total</option>
            </select>
            <span class="contador" id="contador"></span>
        </div>
        <div id="msg" class="msg mb-1"></div>
        <div id="lista"><div class="esqueleto"></div></div>
    </main>

    <footer><p>&copy; 2026 GERONEX - Todos los derechos reservados.</p></footer>

    <script src="js/geronex.js"></script>
    <script src="js/reservaciones.js"></script>
</body>
</html>
